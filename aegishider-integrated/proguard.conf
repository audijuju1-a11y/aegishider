# Conservative plugin obfuscation: rename internal classes/members, keep the Paper entry
# point, event handlers and shaded FastUtil intact. Shrinking/optimisation are deliberately
# disabled so behaviour cannot change; string encryption runs before this pass.
-dontshrink
-dontoptimize
-dontusemixedcaseclassnames
-dontnote **
-dontwarn **
-verbose

-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,MethodParameters,Exceptions

-keep public class dev.audismp.aegishider.AegishiderPlugin {
    public *;
    protected *;
}

-keep class dev.audismp.aegishider.libs.fastutil.** { *; }

-keepclassmembers class * {
    @org.bukkit.event.EventHandler <methods>;
}

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

-repackageclasses 'lib'
-allowaccessmodification
